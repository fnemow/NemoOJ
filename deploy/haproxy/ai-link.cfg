# 仅供 WireGuard 对端上的 Nemo Agent 使用；公网 ACL 仍必须关闭 5672/8103。
global
    log stdout format raw local0
    maxconn 128

defaults
    log global
    timeout connect 5s
    timeout client 13m
    timeout server 13m

frontend ai_amqp
    bind *:5672
    mode tcp
    default_backend rabbitmq_backend

backend rabbitmq_backend
    mode tcp
    server rabbitmq rabbitmq:5672 check

frontend ai_question_callbacks
    bind *:8103
    mode http
    acl is_post method POST
    acl ai_task_path path_reg ^/api/question/internal/ai/tasks/[0-9a-fA-F-]{36}/(claim|context|complete|fail|heartbeat|validations(/[0-9a-fA-F-]{36})?|calls/[0-9a-fA-F-]{36}/(start|finish))$
    http-request deny deny_status 403 unless is_post ai_task_path
    default_backend question_backend

backend question_backend
    mode http
    server question question-service:8103 check
