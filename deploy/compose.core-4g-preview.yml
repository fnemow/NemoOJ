# 4 GiB 主机的首次验收叠加层：前端只绑定宿主机回环地址，经 SSH 隧道访问。
# 与 docker-compose.yml、compose.core-cloud.yml 同时使用；公网 TLS 发布另行配置。
x-static-discovery: &static-discovery '{"spring":{"cloud":{"discovery":{"client":{"simple":{"instances":{"OJ-backend-user-service":[{"uri":"http://user-service:8102"}],"OJ-backend-question-service":[{"uri":"http://question-service:8103"}],"OJ-backend-judge-service":[{"uri":"http://judge-service:8104"}]}}}}}}}'

services:
  proxy:
    profiles: [public]

  preview-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18081:81" # API-only SSH acceptance, no HTML pages.
    volumes:
      - ../nemo-frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/preview.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/acceptance-api.conf:/etc/nginx/conf.d/acceptance-api.conf:ro
    networks: [app, preview-egress]
    depends_on:
      gateway: { condition: service_healthy }

  mysql:
    mem_limit: 512m
    environment:
      MYSQL_USER: ${DB_USERNAME:?请设置数据库应用账号}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请设置数据库应用密码}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=128M
      - --max-connections=60
      - --performance-schema=OFF

  redis:
    mem_limit: 96m
    command: [redis-server, --requirepass, "${REDIS_PASSWORD}", --appendonly, "yes", --maxmemory, 64mb, --maxmemory-policy, noeviction]

  rabbitmq:
    mem_limit: 320m

  nacos:
    profiles: [legacy-nacos]
    mem_limit: 512m
    environment:
      JVM_XMS: 128m
      JVM_XMX: 256m
      JVM_XMN: 64m

  gateway:
    mem_limit: 320m
    environment:
      SPRING_APPLICATION_JSON: *static-discovery
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx224m -XX:+UseSerialGC
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:-nacos}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?请设置 Nacos 密码}

  user-service:
    mem_limit: 384m
    environment:
      SPRING_APPLICATION_JSON: *static-discovery
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m -XX:+UseSerialGC
      DB_POOL_SIZE: "5"
      DB_POOL_MIN_IDLE: "1"
      SESSION_COOKIE_SECURE: "false"
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:-nacos}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?请设置 Nacos 密码}

  question-service:
    mem_limit: 448m
    environment:
      SPRING_APPLICATION_JSON: *static-discovery
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx288m -XX:+UseSerialGC
      DB_POOL_SIZE: "5"
      DB_POOL_MIN_IDLE: "1"
      SESSION_COOKIE_SECURE: "false"
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:-nacos}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?请设置 Nacos 密码}

  judge-service:
    mem_limit: 320m
    environment:
      SPRING_APPLICATION_JSON: *static-discovery
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx224m -XX:+UseSerialGC
      RABBITMQ_PREFETCH: "1"
      RABBITMQ_CONCURRENCY: ${NEMO_CORE_JUDGE_CONCURRENCY:-1}
      # 与 4 GB 部署的单个后台沙箱槽位对齐，避免组合并发导致容量暂停。
      AI_PRIVATE_VALIDATION_COMBINATION_CONCURRENCY: ${AI_PRIVATE_VALIDATION_COMBINATION_CONCURRENCY:-1}
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:-nacos}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?请设置 Nacos 密码}

  sandbox:
    mem_limit: 640m
    user: "0:0" # docker.sock 属于宿主机 root；沙箱服务不接公网/业务网络
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx384m -XX:+UseSerialGC
      SANDBOX_MAX_CONCURRENT_TASKS: ${NEMO_CORE_SANDBOX_SLOTS:-1}
      # 4 GB 主机先保证前台提交容量，后台验证按一个请求运行。
      SANDBOX_BACKGROUND_MAX_CONCURRENT: ${SANDBOX_BACKGROUND_MAX_CONCURRENT:-1}
      # Rootful systemd + cgroup v2: only the trusted sandbox receives this read-only mount.
      SANDBOX_DOCKER_HOST_CGROUP_ROOT: /host-cgroup
    volumes:
      - /sys/fs/cgroup:/host-cgroup:ro

  ai-link-proxy:
    mem_limit: 48m

networks:
  preview-egress:
    driver: bridge
