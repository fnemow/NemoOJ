spring:
  mail:
    properties:
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user:8102
          predicates:
            - Path=/api/user/**
        - id: question-service
          uri: http://question:8103
          predicates:
            - Path=/api/question/**
        - id: ai-user-api
          uri: http://question:8103
          predicates:
            - Path=/api/ai/**
          filters:
            - RewritePath=/api/ai/(?<segment>.*), /api/question/ai/${segment}
        - id: ai-admin-api
          uri: http://question:8103
          predicates:
            - Path=/api/admin/ai/**
          filters:
            - RewritePath=/api/admin/ai/(?<segment>.*), /api/question/admin/ai/${segment}
        - id: judge-service
          uri: http://judge:8104
          predicates:
            - Path=/api/judge/**
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    openfeign:
      client:
        config:
          OJ-backend-user-service:
            url: http://user:8102
          OJ-backend-question-service:
            url: http://question:8103
          OJ-backend-judge-service:
            url: http://judge:8104
            readTimeout: 600000
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
