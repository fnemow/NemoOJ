# ============================================================
# NemoOJ 单机部署编排（Linux）
#
# 网络隔离是本文件的核心目标：
#   * 只有 proxy 接入 public 网络并对外发布端口；
#   * 业务服务在 app 网络内互通，**不发布任何端口**；
#   * 沙箱单独在 sandbox 网络，只有判题服务能到达；
#   * 存储（MySQL/Redis/RabbitMQ/Nacos）在 data 网络，业务服务可达，外部不可达。
#
# 用法：
#   cp deploy/.env.example deploy/.env   # 填好真实值
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d
#
# 注意：本文件未在真实 Linux 环境验证过（开发机为 Windows、无 Docker）。
# 首次部署请按 DEPLOY.md 的顺序逐段启动并核对。
# ============================================================

name: nemo-oj

# 应用服务同时接入两个网络：
#   app  —— 服务之间互相调用
#   data —— 访问 MySQL / Redis / RabbitMQ / Nacos
# 存储只接 data，而 public 只含 proxy 与 gateway，因此存储不会被对外暴露。
x-app-common: &app-common
  restart: unless-stopped
  networks: [app, data]
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  # ---------------- 反向代理：唯一对外入口 ----------------
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/oj.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [public, app]
    depends_on: [gateway]

  # ---------------- 网关 ----------------
  gateway:
    image: ${NEMO_GATEWAY_IMAGE}
    <<: *app-common
    # 不发布端口：只有 proxy 能到达
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MANAGEMENT_PORT: 9101
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8101/api/user/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---------------- 用户服务 ----------------
  user-service:
    image: ${NEMO_USER_IMAGE}
    <<: *app-common
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_DATABASE: ${REDIS_DATABASE}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET}
      MANAGEMENT_PORT: 9102
      RATELIMIT_TRUST_XFF: ${RATELIMIT_TRUST_XFF}
      RATELIMIT_LOGIN_IP: ${RATELIMIT_LOGIN_IP:-60}
      RATELIMIT_LOGIN_ACCOUNT: ${RATELIMIT_LOGIN_ACCOUNT:-20}
      RATELIMIT_LOGIN_WINDOW: ${RATELIMIT_LOGIN_WINDOW:-60}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9102/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---------------- 题目服务 ----------------
  question-service:
    image: ${NEMO_QUESTION_IMAGE}
    <<: *app-common
    networks: [app, data, ai]
    environment:
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      SPRING_PROFILES_ACTIVE: prod
      JUDGE_ENABLED_LANGUAGES: ${JUDGE_ENABLED_LANGUAGES:-java}
      JUDGE_PYTHON_MODES: ${JUDGE_PYTHON_MODES:-ACM,FUNCTION}
      JUDGE_CPP_MODES: ${JUDGE_CPP_MODES:-ACM,FUNCTION}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_DATABASE: ${REDIS_DATABASE}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET}
      MANAGEMENT_PORT: 9103
      SERVER_TOMCAT_THREADS_MAX: ${QUESTION_TOMCAT_MAX_THREADS:-200}
      RATELIMIT_TRUST_XFF: ${RATELIMIT_TRUST_XFF}
      RATELIMIT_SUBMIT_USER: ${RATELIMIT_SUBMIT_USER:-20}
      RATELIMIT_SUBMIT_IP: ${RATELIMIT_SUBMIT_IP:-60}
      RATELIMIT_SUBMIT_WINDOW: ${RATELIMIT_SUBMIT_WINDOW:-60}
      RATELIMIT_SUBMIT_PENDING: ${RATELIMIT_SUBMIT_PENDING:-8}
      OUTBOX_MAX_RETRIES: ${OUTBOX_MAX_RETRIES}
      AI_ANALYSIS_ENABLED: ${AI_ANALYSIS_ENABLED:-false}
      AI_LEARNING_ENABLED: ${AI_LEARNING_ENABLED:-false}
      AI_CATALOG_PLANS_ENABLED: ${AI_CATALOG_PLANS_ENABLED:-true}
      AI_PRIVATE_BATCHES_ENABLED: ${AI_PRIVATE_BATCHES_ENABLED:-true}
      AI_PRIVATE_PROBLEMS_ENABLED: ${AI_PRIVATE_PROBLEMS_ENABLED:-false}
      AI_FEEDBACK_ENABLED: ${AI_FEEDBACK_ENABLED:-false}
      AI_MAINTENANCE_ENABLED: ${AI_MAINTENANCE_ENABLED:-false}
      AI_MODEL_ENABLED: ${AI_MODEL_ENABLED:-false}
      AI_MODEL_PROVIDER: ${AI_MODEL_PROVIDER:-}
      AI_MODEL_ID: ${AI_MODEL_ID:-}
      AI_INTERNAL_SECRET: ${AI_INTERNAL_SECRET:-}
      AI_ANALYSIS_PER_DAY: ${AI_ANALYSIS_PER_DAY:-5}
      AI_TASKS_PER_MINUTE: ${AI_TASKS_PER_MINUTE:-5}
      AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-0}
      AI_MAX_TASK_BUDGET_USD: ${AI_MAX_TASK_BUDGET_USD:-0}
      AI_MODEL_MAX_ATTEMPTS: ${AI_MODEL_MAX_ATTEMPTS:-2}
      AI_MODEL_MAX_CALLS_PER_TASK: ${AI_MODEL_MAX_CALLS_PER_TASK:-4}
      JUDGE_ADMISSION_MAX_PENDING: ${JUDGE_ADMISSION_MAX_PENDING:-12}
      JUDGE_ADMISSION_MAX_OLDEST_SECONDS: ${JUDGE_ADMISSION_MAX_OLDEST_SECONDS:-120}
      JUDGE_ADMISSION_RETRY_AFTER_SECONDS: ${JUDGE_ADMISSION_RETRY_AFTER_SECONDS:-5}
      AI_ESCALATION_EMAIL: ${AI_ESCALATION_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_SSL_TRUST: ${SMTP_SSL_TRUST:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9103/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---------------- 判题服务 ----------------
  judge-service:
    image: ${NEMO_JUDGE_IMAGE}
    restart: unless-stopped
    # 唯一同时接入 sandbox 网络的服务；data 用于访问存储
    networks: [app, data, sandbox]
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: ${REDIS_HOST}
      REDIS_DATABASE: ${REDIS_DATABASE}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET}
      SANDBOX_BASE_URL: ${SANDBOX_BASE_URL}
      SANDBOX_SECRET: ${SANDBOX_SECRET}
      JUDGE_ENABLED_LANGUAGES: ${JUDGE_ENABLED_LANGUAGES:-java}
      JUDGE_PYTHON_MODES: ${JUDGE_PYTHON_MODES:-ACM,FUNCTION}
      JUDGE_CPP_MODES: ${JUDGE_CPP_MODES:-ACM,FUNCTION}
      JUDGE_CPP_SPLIT_PROTOCOL_ENABLED: ${JUDGE_CPP_SPLIT_PROTOCOL_ENABLED:-false}
      JUDGE_LEASE_SECONDS: ${JUDGE_LEASE_SECONDS}
      JUDGE_LEASE_MAX_ATTEMPTS: ${JUDGE_LEASE_MAX_ATTEMPTS}
      MANAGEMENT_PORT: 9104
      RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH}
      RABBITMQ_CONCURRENCY: ${RABBITMQ_CONCURRENCY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9104/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ---------------- 沙箱 ----------------
  sandbox:
    image: ${NEMO_SANDBOX_IMAGE}
    restart: unless-stopped
    # user.dir is the workspace parent used by the sandbox. It must resolve
    # to the same absolute path on the host for nested Docker bind mounts.
    working_dir: /var/lib/nemo-oj/sandbox
    # 沙箱不接 data：它不需要数据库/缓存，接入只会扩大暴露面
    networks: [sandbox]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SANDBOX_SECRET: ${SANDBOX_SECRET}
      JUDGE_ENABLED_LANGUAGES: ${JUDGE_ENABLED_LANGUAGES:-java}
      JUDGE_PYTHON_MODES: ${JUDGE_PYTHON_MODES:-ACM,FUNCTION}
      JUDGE_CPP_MODES: ${JUDGE_CPP_MODES:-ACM,FUNCTION}
      SANDBOX_JAVA_IMAGE: ${SANDBOX_JAVA_IMAGE}
      SANDBOX_PYTHON_IMAGE: ${SANDBOX_PYTHON_IMAGE:-}
      SANDBOX_CPP_IMAGE: ${SANDBOX_CPP_IMAGE:-}
      SANDBOX_CPP_SPLIT_PROTOCOL_ENABLED: ${SANDBOX_CPP_SPLIT_PROTOCOL_ENABLED:-false}
      SANDBOX_MAX_CONCURRENT_TASKS: ${SANDBOX_MAX_CONCURRENT_TASKS:-4}
      SANDBOX_BACKGROUND_IDLE_GRACE_MS: ${SANDBOX_BACKGROUND_IDLE_GRACE_MS:-1000}
      SANDBOX_BACKGROUND_MAX_CONCURRENT: ${SANDBOX_BACKGROUND_MAX_CONCURRENT:-2}
      SANDBOX_FOREGROUND_BACKGROUND_WAIT_MS: ${SANDBOX_FOREGROUND_BACKGROUND_WAIT_MS:-15000}
      SANDBOX_BACKGROUND_MIN_AVAILABLE_MEMORY_KB: ${SANDBOX_BACKGROUND_MIN_AVAILABLE_MEMORY_KB:-524288}
      SANDBOX_ORPHAN_MIN_AGE_MS: ${SANDBOX_ORPHAN_MIN_AGE_MS:-900000}
      SANDBOX_REAPER_INTERVAL_MS: ${SANDBOX_REAPER_INTERVAL_MS:-300000}
      MANAGEMENT_PORT: 9190
    volumes:
      # 沙箱通过 Docker daemon 创建容器，工作目录必须落在**宿主机**可见的路径上。
      # 若沙箱自身容器化，两个路径必须一致，否则容器内的绑定挂载指向不存在的目录。
      # 见 SANDBOX-PATHS 说明（DEPLOY.md）。
      - /var/lib/nemo-oj/sandbox:/var/lib/nemo-oj/sandbox
      - /var/run/docker.sock:/var/run/docker.sock
    # 说明：挂载 docker.sock 等价于给予宿主机 root 能力，因此该容器
    # **绝不能**接入 public/app 网络，也绝不能对外暴露任何端口。

  # ---------------- 存储 ----------------
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    networks: [data]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: nemo_oj
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行迁移；顺序由文件名的 V 序号决定
      - ./migration:/docker-entrypoint-initdb.d/migration:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [data]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    networks: [data, ai]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    # 管理台（15672）刻意不发布端口：需要时通过 SSH 隧道访问

  nacos:
    image: nacos/nacos-server:v2.4.3
    restart: unless-stopped
    networks: [data]
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?必须设置独立的 Nacos 鉴权密钥}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?必须设置}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?必须设置}
    volumes:
      - ../nemo-frontend/dist:/usr/share/nginx/html:ro
      - nacos-data:/home/nacos/data
    # 控制台（8848/9848）不发布端口，同样通过 SSH 隧道访问

  # ---------------- AI Agent（无入站端口、无 Docker/Sandbox 权限） ----------------
  ai-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [ai]
    environment:
      POSTGRES_DB: ${AI_POSTGRES_DB:-langgraph}
      POSTGRES_USER: ${AI_POSTGRES_USER:-langgraph}
      POSTGRES_PASSWORD: ${AI_POSTGRES_PASSWORD:?请设置 AI_POSTGRES_PASSWORD}
    volumes:
      - ai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  nemo-agent:
    build:
      context: ../nemo-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [ai, ai-egress]
    depends_on:
      rabbitmq: { condition: service_healthy }
      ai-postgres: { condition: service_healthy }
      question-service: { condition: service_healthy }
    environment:
      AI_ENVIRONMENT: ${AI_ENVIRONMENT:-production}
      AI_PROVIDER: ${AI_MODEL_PROVIDER:-}
      AI_MODEL_ID: ${AI_MODEL_ID:-}
      AI_API_KEY: ${AI_MODEL_API_KEY:-}
      AI_BASE_URL: ${AI_MODEL_BASE_URL:-}
      AI_INTERNAL_SECRET: ${AI_INTERNAL_SECRET:-}
      AI_QUESTION_SERVICE_URL: http://question-service:8103
      AI_RABBITMQ_HOST: rabbitmq
      AI_RABBITMQ_PORT: 5672
      AI_RABBITMQ_USER: ${RABBITMQ_USERNAME}
      AI_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      AI_POSTGRES_URL: postgresql://${AI_POSTGRES_USER:-langgraph}:${AI_POSTGRES_PASSWORD}@ai-postgres:5432/${AI_POSTGRES_DB:-langgraph}
      AI_MOCK_ENABLED: ${AI_MOCK_ENABLED:-false}
      AI_MODEL_TIMEOUT_SECONDS: ${AI_MODEL_TIMEOUT_SECONDS:-45}
      AI_INPUT_USD_PER_MILLION_TOKENS: ${AI_INPUT_USD_PER_MILLION_TOKENS:-0}
      AI_OUTPUT_USD_PER_MILLION_TOKENS: ${AI_OUTPUT_USD_PER_MILLION_TOKENS:-0}

networks:
  public:      # 仅 proxy 与 gateway
    driver: bridge
  app:         # 业务服务之间
    driver: bridge
    internal: true
  sandbox:     # 仅 sandbox 与 judge-service
    driver: bridge
    internal: true
  data:        # 存储
    driver: bridge
    internal: true
  ai:          # AI 任务专用内网；Agent 不加入业务服务网或数据库网
    driver: bridge
    internal: true
  ai-egress:   # 仅 Agent 出站访问模型 API；无映射端口
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
  ai-postgres-data:
