# Private API-only acceptance. No HTML/authentication pages; no registration.
server {
    listen 81;
    server_name _;
    client_max_body_size 1m;
    location ~* ^/api/user/register(/|$) { return 403; }
    location ~ ^/api/[^/]+/(inner|internal)/ { return 403; }
    location = /api/question/list/page/vo {
        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;
        gzip_comp_level 4;
        gzip_vary on;
        gzip_proxied any;
        proxy_pass http://gateway:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /api/question/question_submit/events {
        proxy_pass http://gateway:8101;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 11m;
        add_header X-Accel-Buffering no;
    }
    location /api/ {
        proxy_pass http://gateway:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        gzip off;
    }
    location / { return 404; }
}
