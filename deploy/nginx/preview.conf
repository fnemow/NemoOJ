# 仅用于 SSH 隧道验收，Compose 只将本容器绑定到 127.0.0.1:18080。
server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    # Existing accounts may log in; registration remains closed.
    location ~* ^/register(/|$) { return 302 /login; }
    location ~* ^/api/user/register(/|$) { return 403; }

    location /assets/ {
        try_files $uri =404;
        gzip_static on;
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types application/javascript text/css image/svg+xml;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location ~ ^/api/[^/]+/(inner|internal)/ {
        return 403;
    }
    location ~ ^/(actuator|management) {
        return 404;
    }

    # This response contains public catalog data only. Keep authentication,
    # source code, AI reports and SSE outside response compression.
    location = /api/question/list/page/vo {
        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;
        gzip_comp_level 4;
        gzip_vary on;
        gzip_proxied any;
        proxy_pass http://gateway:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /api/question/question_submit/events {
        proxy_pass http://gateway:8101;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 11m;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        gzip off;
        proxy_pass http://gateway:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
