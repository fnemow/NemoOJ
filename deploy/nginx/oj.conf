# ============================================================
# NemoOJ 反向代理配置
#
# 唯一的对外入口。要点：
#   * 只转发到网关，不直接暴露任何业务服务；
#   * 强制 HTTPS，HTTP 一律重定向；
#   * 注入 X-Request-Id（若客户端未带），使日志可串联；
#   * 覆盖客户端传入的 X-Forwarded-For，避免伪造 IP 绕过限流。
# ============================================================

# 限流依赖真实客户端 IP，因此必须由代理注入且不可被客户端伪造。
# 注意：应用侧 RATELIMIT_TRUST_XFF 必须与这里的配置一致——
# 只有当请求确实经过本代理时才可采信 XFF。

upstream nemo_gateway {
    server gateway:8101;
    keepalive 32;
}

# map 只能声明在 http 上下文；conf.d 文件本身由 nginx.conf 的 http 块加载。
map $http_x_request_id $nemo_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# HTTP -> HTTPS
server {
    absolute_redirect off;
    listen 80;
    server_name _;
    # 仅保留 ACME 校验路径，其余全部跳转 HTTPS
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    absolute_redirect off;
    http2 on;
    server_name oj.example.com;   # 替换为实际域名

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # 请求体上限与应用的 ratelimit.max-request-body-bytes 保持一致。
    # 两侧不一致时，较小的那个生效，容易出现"代理放行、应用拒绝"的困惑。
    client_max_body_size 1m;
    root /usr/share/nginx/html;
    index index.html;
    # Login/submission restored; registration remains closed independently.
    location ~* ^/register(/|$) { return 302 /login; }
    location ~* ^/api/user/register(/|$) { return 403; }
    location /assets/ {
        try_files $uri =404;
        gzip_static on;
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types application/javascript text/css image/svg+xml;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html { add_header Cache-Control "no-cache" always; }

    # 提交接口耗时较长（等待判题受理），但不应无限等待
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # 覆盖而非追加 XFF：追加会让客户端伪造的段位保留在内，
    # 应用取第一段时就拿到了伪造 IP。
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Host              $host;

    # 客户端未带 requestId 时由代理生成，保证每个请求都可追踪
    proxy_set_header X-Request-Id $nemo_request_id;

    # 与 SSH 预览入口保持一致：仅压缩公开题库列表，不压缩私有 API 或 SSE。
    location = /api/question/list/page/vo {
        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;
        gzip_comp_level 4;
        gzip_vary on;
        gzip_proxied any;
        proxy_pass http://nemo_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Host              $host;
        proxy_set_header X-Request-Id      $nemo_request_id;
        proxy_hide_header Server;
    }

    # 判题进度使用 SSE。关闭代理缓冲才能让每个状态事件立即到达浏览器，
    # 读取超时略长于应用侧连接寿命；断线后前端会自动重连并继续轮询兜底。
    location = /api/question/question_submit/events {
        proxy_pass http://nemo_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Host              $host;
        proxy_set_header X-Request-Id      $nemo_request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 11m;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        gzip off;
        proxy_pass http://nemo_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 当前 location 声明了 proxy_set_header，不会继承 server 层的这些头。
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Host              $host;
        proxy_set_header X-Request-Id      $nemo_request_id;
        # 不回显上游的 Server 头，减少版本信息暴露
        proxy_hide_header Server;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # 管理端点不对外：显式拒绝，避免将来误配把 /actuator 暴露出去
    location ~ ^/(actuator|management) {
        return 404;
    }

    # 内部接口不应经代理到达（网关也会拦，这里是第二道）
    location ~ ^/api/[^/]+/(inner|internal)(/|$) {
        return 403;
    }
}

# 说明：应用侧的安全响应头（HSTS 等）建议在此添加或由前置 CDN 统一处理。
# 本文件保持最小可用，避免与部署平台既有防护重复。
